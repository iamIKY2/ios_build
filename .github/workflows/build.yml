name: Build iOS Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      diagnostics:
        description: Show startup debug logs inside the app
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build Enigma unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Install dependencies
        run: |
          set -euo pipefail
          flutter --version
          xcodebuild -version
          flutter pub get

      - name: Analyze and test
        run: |
          set -euo pipefail
          flutter analyze --no-pub
          flutter test --no-pub
          flutter test --no-pub --dart-define=ENIGMA_DIAGNOSTICS=true \
            test/startup_entrypoint_test.dart test/runtime_diagnostics_test.dart

      - name: Validate iOS configuration and install pods
        run: |
          set -euo pipefail
          plutil -lint ios/Runner/Info.plist ios/Runner/Runner.entitlements ios/Flutter/AppFrameworkInfo.plist ios/Runner.xcodeproj/project.pbxproj
          ruby -c ios/Podfile
          cd ios
          pod install --repo-update

      - name: Build iOS release without signing
        env:
          ENIGMA_DIAGNOSTICS: ${{ inputs.diagnostics }}
          ENIGMA_BUILD_SHA: ${{ github.sha }}
          ENIGMA_BUILD_RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir -p build/diagnostics
          printf 'commit=%s\nrun=%s\ndiagnostics=%s\n' \
            "$ENIGMA_BUILD_SHA" "$ENIGMA_BUILD_RUN" "$ENIGMA_DIAGNOSTICS" \
            | tee build/diagnostics/build-info.txt
          flutter build ios --release --no-codesign --verbose \
            --build-number="$ENIGMA_BUILD_RUN" \
            --dart-define=ENIGMA_DIAGNOSTICS="$ENIGMA_DIAGNOSTICS" \
            --dart-define=ENIGMA_BUILD_SHA="$ENIGMA_BUILD_SHA" \
            --dart-define=ENIGMA_BUILD_RUN="$ENIGMA_BUILD_RUN" \
            2>&1 | tee build/diagnostics/ios-build.log

      - name: Package and verify unsigned IPA
        run: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app
          staging_dir="$(mktemp -d "$RUNNER_TEMP/enigma-ipa.XXXXXX")"
          mkdir -p "$staging_dir/Payload" "$GITHUB_WORKSPACE/build/ios/ipa"
          ditto build/ios/iphoneos/Runner.app "$staging_dir/Payload/Runner.app"
          cd "$staging_dir"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/build/ios/ipa/Enigma-unsigned.ipa" Payload
          /usr/bin/unzip -t "$GITHUB_WORKSPACE/build/ios/ipa/Enigma-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: Enigma-unsigned-ipa
          path: build/ios/ipa/Enigma-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload build debug logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Enigma-ios-build-logs
          path: build/diagnostics/
          if-no-files-found: ignore
          retention-days: 7
