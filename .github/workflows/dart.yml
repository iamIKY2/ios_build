name: iOS Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ios:
    name: 🎉 Build iOS IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'    # pin version để build ổn định
          channel: 'stable'
          cache: true

      - name: Flutter clean
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS Application (Release, Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package Payload to .ipa
        working-directory: build/ios/iphoneos
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qq -r -9 mentality.ipa Payload
          ls -lh mentality.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mentality-ipa
          path: build/ios/iphoneos/mentality.ipa
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: build/ios/iphoneos/mentality.ipa
          tag_name: ios-release-${{ github.run_number }}
          name: "iOS Build #${{ github.run_number }}"
          body: |
            ## iOS Build #${{ github.run_number }}
            
            - **Commit:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`
            - **Triggered by:** @${{ github.actor }}
            
            ⚠️ IPA unsigned — cần ký lại bằng Sideloadly/AltStore trước khi cài.
          draft: false
          prerelease: false
