name: iOS Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-ios:
    name: 🎉 Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS Application (Release, Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package Payload to .ipa
        run: |
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qq -r -9 mentality.ipa Payload
        working-directory: build/ios/iphoneos

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mentality-ipa
          path: build/ios/iphoneos/mentality.ipa
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: build/ios/iphoneos/mentality.ipa
          tag_name: ios-release-${{ github.run_number }}
          name: "iOS Build #${{ github.run_number }}"
          body: "Tệp cài đặt IPA (unsigned) cho ứng dụng iOS được build tự động."
        continue-on-error: true
